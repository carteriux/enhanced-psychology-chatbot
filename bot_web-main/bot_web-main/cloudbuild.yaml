steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/enhanced-frontend', '.']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/enhanced-frontend']
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'enhanced-frontend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/enhanced-frontend'
      - '--region'
      - 'us-south1'
      - '--allow-unauthenticated'
      - '--set-env-vars'
      - 'NEXT_PUBLIC_BACKEND_URL=https://enhanced-api-58720089427.us-south1.run.app'

options:
  logging: CLOUD_LOGGING_ONLY
